<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Isaiah Okuna</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <header class="site-header">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <div class="brand-logo">IO</div>
                <div class="brand-text">
                    <h1>Isaiah Okuna</h1>
                    <span>Economist & Programmer</span>
                </div>
            </a>
            <nav>
                <ul id="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contact.html" class="btn-nav">Back to Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main style="min-height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center;">
        <div class="container">
            <div class="card" style="max-width: 600px; margin: 0 auto; padding: 4rem;" id="thanks-card">
                <div style="font-size: 4rem; margin-bottom: 2rem;">✉</div>
                <h2 class="gradient-text">Message Received.</h2>
                <p class="text-muted" style="margin-bottom: 2rem;">Thank you for reaching out. I've received your message and will get back to you within 48 hours.</p>
                <a href="index.html" class="btn btn-primary">Return Home</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <p>&copy; <span id="year"></span> Isaiah Okuna. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.from("#thanks-card", {
                opacity: 0,
                y: 30,
                duration: 1,
                ease: "power3.out"
            });
        });
    </script>
</body>
</html>
